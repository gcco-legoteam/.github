name: Replicate Issue Templates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/ISSUE_TEMPLATE/zz_*.yml'

jobs:
  list-repos:
    name: List Org Repos
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Find repos with issue templates
        id: list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          current_repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          repos=()
          while IFS= read -r repo; do
            response=$(gh api "repos/${owner}/${repo}/contents/.github/ISSUE_TEMPLATE" 2>/dev/null) \
              && count=$(echo "$response" | jq 'if type == "array" then length else 0 end') \
              || count=0
            if [[ "$count" -gt 0 ]]; then
              repos+=("$repo")
            fi
          done < <(gh api "orgs/${owner}/repos" \
            --paginate \
            --jq '.[].name' \
            | grep -v "^${current_repo}$")
          echo "repos=$(printf '%s\n' "${repos[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  replicate:
    name: Replicate to ${{ matrix.repo }}
    needs: list-repos
    if: needs.list-repos.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.list-repos.outputs.repos) }}
      fail-fast: false

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout destination repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: dest

      - name: Update default templates
        run: |
          find dest/.github/ISSUE_TEMPLATE -name 'zz_*.yml' -delete
          cp source/.github/ISSUE_TEMPLATE/zz_*.yml dest/.github/ISSUE_TEMPLATE/

      - name: Commit and push
        working-directory: dest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/
          git diff --staged --quiet || git commit -m "chore: sync default issue templates from .github"
          git push
