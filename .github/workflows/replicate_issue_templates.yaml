name: Replicate Issue Templates

on:
  push:
    branches:
      - main
    paths:
      - '.github/ISSUE_TEMPLATE/zz_*.yaml'

jobs:
  list-repos:
    name: List Org Repos
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: List org repos
        id: list
        env:
          GH_TOKEN: ${{ secrets.ORG_APP_TOKEN }}
        run: |
          current_repo="${{ github.event.repository.name }}"
          repos=$(gh api "orgs/${{ github.repository_owner }}/repos" \
            --paginate \
            --jq '.[].name' \
            | grep -v "^${current_repo}$" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "repos=${repos}" >> "$GITHUB_OUTPUT"

  replicate:
    name: Replicate to ${{ matrix.repo }}
    needs: list-repos
    if: needs.list-repos.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.list-repos.outputs.repos) }}
      fail-fast: false
      
    steps:
      - name: Check if destination repo has ISSUE_TEMPLATE files
        id: check
        env:
          GH_TOKEN: ${{ secrets.ORG_APP_TOKEN }}
        run: |
          count=$(gh api \
            "repos/${{ github.repository_owner }}/${{ matrix.repo }}/contents/.github/ISSUE_TEMPLATE" \
            --jq 'if type == "array" then length else 0 end' 2>/dev/null || echo "0")
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout destination repo
        if: steps.check.outputs.count != '0'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ secrets.ORG_APP_TOKEN }}
          path: dest

      - name: Update STD templates
        if: steps.check.outputs.count != '0'
        run: |
          find dest/.github/ISSUE_TEMPLATE -name 'zz_*.yaml' -delete
          cp source/.github/ISSUE_TEMPLATE/zz_*.yaml dest/.github/ISSUE_TEMPLATE/

      - name: Commit and push
        if: steps.check.outputs.count != '0'
        working-directory: dest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/
          git diff --staged --quiet || git commit -m "chore: sync STD issue templates from .github"
          git push
