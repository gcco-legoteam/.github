# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: 🐛 Bug Report *
description: Report a bug or unexpected behaviour across any platform, tool, or client-facing service.
title: "[Bug] "
projects: ["gcco-legoteam/13"]
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Use this form to report bugs across any platform, tool, or client-facing service managed by the Evo team. 
        
        Fill in as much detail as you can to help us triage and resolve quickly.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which functional area does this bug affect?
      options:
        - Platform & Infrastructure
        - Client Experience
        - Branding & Communications
        - Security & Compliance
        - CRM (Budibase)
        - User Invitations & Onboarding
        - Notifications
        - Operations & Internal Tools
        - Other
    validations:
      required: true

  - type: dropdown
    id: cloud_platform
    attributes:
      label: Cloud Platform
      multiple: true
      options:
        - Azure
        - AWS
        - GCP
        - Entra ID
        - GitHub
        - Multi-Cloud
        - N/A

  - type: dropdown
    id: teams-involved
    attributes:
      label: Teams Involved
      multiple: true
      options:
        - EVO
        - OPS
        - External / Client
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behaviour...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Navigate to '...'
        2. Click / select '...'
        3. Observe error or unexpected result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened instead?
    validations:
      required: true

