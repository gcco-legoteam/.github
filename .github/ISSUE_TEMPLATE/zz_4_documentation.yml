name: 📝 Documentation *
description: New documentation, updates to existing docs, runbooks, client guides, architecture records, and SOPs.
title: "[Docs]: "
projects: ["gcco-legoteam/13"]
type: "Documentation"
body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Task
        Use this form to track the creation of new documentation or updates to existing docs, runbooks, SOPs, client guides, and architectural decision records.

  - type: dropdown
    id: doc
    attributes:
      label: Documentation Type
      description: What kind of documentation needs to be created or updated?
      options:
        - New Documentation
        - Update Existing Documentation
        - Runbook / SOP
        - Client Guide / Onboarding Material
        - Architecture / Design Document
        - Process Documentation
        - Meeting Notes / Summary
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Audience
      description: Who is this documentation intended for?
      options:
        - Internal
        - Client-Facing
        - Both
    validations:
      required: true

  - type: dropdown
    id: csp
    attributes:
      label: Cloud Platform
      multiple: true
      options:
        - Azure
        - AWS
        - GCP
        - Entra ID
        - GitHub
        - Multi-Cloud
        - N/A
  - type: dropdown
    id: team
    attributes:
      label: Teams Involved
      multiple: true
      options:
        - EVO
        - OPS
        - External / Client
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What documentation needs to be created or updated? Why is it needed?
      placeholder: |
        Describe the documentation task in detail. Focus on:
        - What the documentation is about
        - Who the audience is
        - Why it's needed and what problem it solves
        - Provide an outline or key points to cover if possible
        - If existing documentation exists, provide links and specify what needs updating
    validations:
      required: true