# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: ✨ Feature *
description: Propose a new thing, or an enhancement to an existing thing
title: "[Feature]: "
projects: ["gcco-legoteam/13"]
type: "Feature"
body:
  - type: markdown
    attributes:
      value: |
        # Feature Request Template
        Use this form to propose a new feature or enhancement. Features can be standalone or part of a larger Epic.
        
        **Tips:**
        - Clearly describe what you want to build and why
        - Consider the user experience and how this will be used
        - Link to parent Epics if this is part of a larger initiative
        - Provide acceptance criteria that are testable and specific

  - type: dropdown
    id: feature
    attributes:
      label: Feature Type
      description: Is this a new feature or an enhancement to existing functionality?
      options:
        - "✨ New Feature"
        - "⚡ Enhancement / Extension"
        - "🛠️ Refactor / Technical Improvement"
    validations:
      required: true

  - type: dropdown
    id: csp
    attributes:
      label: Cloud Platform
      multiple: true
      options:
        - Azure
        - AWS
        - GCP
        - Entra ID
        - GitHub
        - N/A

  - type: dropdown
    id: team
    attributes:
      label: Teams Involved
      multiple: true
      options:
        - EVO
        - OPS
        - External / Client
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What is this feature? Provide a clear, concise description of what needs to be built or improved.
      placeholder: |
        Describe the feature or enhancement in detail. Focus on:
        - What users/systems will interact with
        - How it works
        - What problem it solves or what capability it enables
        
        Example: "Add ability to save custom report filters so users don't have to recreate them on each visit"
    validations:
      required: true

  - type: textarea
    id: user_benefit
    attributes:
      label: User Benefit & Value
      description: Why is this feature valuable? What benefit does it provide to users or the business?
      placeholder: |
        - Who benefits from this feature?
        - What problem does it solve?
        - What is the expected user impact?
        
        Example: "Saves users 5-10 minutes per session by not having to reconfigure filters, improving productivity and user satisfaction"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What specific, testable conditions must be met for this feature to be considered complete?
      placeholder: |
        - Users can save up to 5 custom filters
        - Saved filters persist across sessions
        - Filters can be deleted or edited
        - Feature works on desktop and mobile views
        - Load time for filter list is <1 second
        - Filters sync across all user devices within 30 seconds
    validations:
      required: false

  - type: textarea
    id: user_stories
    attributes:
      label: Related User Stories
      description: "Break this feature down into smaller user stories if applicable. (Optional - can create separate issues)"
      placeholder: |
        - [ ] As a user, I want to save my current report filters
        - [ ] As a user, I want to load a previously saved filter with one click
        - [ ] As a user, I want to edit or delete saved filters
        - [ ] As an admin, I want to see which filters are most commonly used
    validations:
      required: false