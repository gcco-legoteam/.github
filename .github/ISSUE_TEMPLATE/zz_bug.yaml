# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: STD - 🐛 Bug Report
description: Report a bug or unexpected behaviour across any platform, tool, or client-facing service.
title: "[Bug]: "
projects: ["gcco-legoteam/13"]
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Use this form to report bugs across any platform, tool, or client-facing service managed by the Evo team. 
        
        Fill in as much detail as you can to help us triage and resolve quickly.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which functional area does this bug affect?
      options:
        - Platform & Infrastructure
        - Client Experience
        - Branding & Communications
        - Security & Compliance
        - CRM (Budibase)
        - User Invitations & Onboarding
        - Notifications
        - Operations & Internal Tools
        - Other
    validations:
      required: true

  - type: dropdown
    id: cloud_platform
    attributes:
      label: Cloud Platform
      multiple: true
      options:
        - Azure
        - AWS
        - GCP
        - Entra ID
        - GitHub
        - Multi-Cloud
        - N/A

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behaviour...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Navigate to '...'
        2. Click / select '...'
        3. Observe error or unexpected result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Relevant environment info to help reproduce the issue.
      placeholder: |
        - Cloud: Azure / GCP / AWS
        - Region / Zone: e.g. canadacentral
        - Subscription / Project / Account: 
        - Service / Resource: e.g. Azure Portal, Budibase, GCP Console
        - Browser + version (if applicable):
        - OS (if applicable):

  - type: textarea
    id: client_impact
    attributes:
      label: Client Impact
      description: Which clients or departments are affected, if any?
      placeholder: e.g. DFO, NRCan, all clients, internal only

  - type: textarea
    id: workaround
    attributes:
      label: Known Workaround
      description: Is there a temporary workaround available?
      placeholder: Describe any known workaround, or write "None"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add screenshots, error messages, or relevant log excerpts here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, related issues, or notes for the team.